# Lab 8 — continuous delivery: a git tag `v*` deploys.
#
#   git tag v1.0.0 && git push origin v1.0.0      (or a GitHub release with a new tag)
#
#   1. ci       the whole CI chain (ci.yml): typecheck, lint, tests, build, e2e, docker build
#   2. image    builds the production image and pushes it to GitHub Container Registry:
#               ghcr.io/<owner>/dogfight:v1.0.0 and :latest   (GITHUB_TOKEN: no extra secret)
#   3. deploy   POSTs the Render deploy hook (repository secret RENDER_DEPLOY_HOOK_URL), then
#               polls PUBLIC_URL/health until it reports THIS commit — "is the tag live?"
#               answered by the server itself. Skipped (with a notice) while the secrets are unset.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false # never cut a deploy in half

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name (registry names must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: trigger the deploy
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null
      - name: wait until /health reports this commit
        if: env.HOOK != '' && env.PUBLIC_URL != ''
        run: |
          for i in $(seq 1 60); do
            sha=$(curl -fsS "$PUBLIC_URL/health" | jq -r .sha || true)
            echo "attempt $i: live sha=$sha"
            if [ "$sha" = "$GITHUB_SHA" ]; then echo "deployed ${GITHUB_REF_NAME} (${GITHUB_SHA})"; exit 0; fi
            sleep 10
          done
          echo "::error::$PUBLIC_URL still runs $sha, expected $GITHUB_SHA"
          exit 1
      - name: no deploy target configured
        if: env.HOOK == ''
        run: echo "::notice::set the RENDER_DEPLOY_HOOK_URL secret and the PUBLIC_URL variable to deploy"
